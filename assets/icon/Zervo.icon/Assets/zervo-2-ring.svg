<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Zervo icon — layer 2: orbit ring (the engine). Transparent background. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9b8ff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8f6ef2" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-24 512 512)">
    <ellipse cx="512" cy="512" rx="398" ry="148" fill="none"
             stroke="url(#ring)" stroke-width="20" stroke-linecap="round"/>
    <!-- Small satellite dot on the orbit -->
    <circle cx="880" cy="430" r="26" fill="#c9b8ff"/>
  </g>
</svg>
