[package]
name = "zervo-core"
# Tracks the binary's version: `net`'s user agent is built from it, and a
# wallpaper host should be told the version of the browser that is asking.
version = "0.5.0"
edition = "2024"
rust-version = "1.97"
license = "MPL-2.0"
description = "Zervo's engine-independent parts: theme, glass, grid, gestures, storage, and a small HTTPS client"
publish = false

[dependencies]
egui = "0.34.3"
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
webpki-roots = "1.0"
winit = "0.30.13"

[lints]
workspace = true
