[workspace]
members = ["zervo-core"]

[package]
name = "zervo"
version = "0.4.1"
edition = "2024"
rust-version = "1.97"
license = "MPL-2.0"
description = "A calm, workspace-oriented browser built on the Servo engine"
repository = "https://github.com/goddv/zervo"
readme = "README.md"
publish = false

[features]
default = []
# File downloads driven by the engine. Requires a Servo build carrying
# patches/servo/0001-embedder-file-downloads.patch — see docs/SERVO.md.
# Without it Zervo still runs; unrenderable responses simply are not offered.
engine-downloads = []
# Audio and video playback. Needs the official GStreamer distribution installed
# at /Library/Frameworks/GStreamer.framework; see docs/PACKAGING.md. Off by
# default so a plain build needs nothing but Rust.
media = ["servo/media-gstreamer"]

# ── Lints ─────────────────────────────────────────────────────────────────
# CONTRIBUTING.md has always said "cargo fmt and cargo clippy clean. CI
# enforces both." Only the first half was true — clippy ran in no workflow at
# all — so this is the policy written down where CI can act on it.
#
# `pedantic` is deliberately not on. It produces some five hundred warnings
# here, almost all of them `cast_precision_loss` and `cast_possible_truncation`
# on the float-to-integer conversions that layout arithmetic is made of. A wall
# that size is not a standard, it is something everyone learns to scroll past.
# What follows is the subset that catches things worth catching in this tree.
[workspace.lints.rust]
# Already the default in edition 2024; stated because the GL and AppKit code
# leans on it and a future edition bump should not quietly relax it.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# The one comment this codebase cannot do without.
undocumented_unsafe_blocks = "warn"
# `#[expect]` over `#[allow]`, so a suppression that has stopped being needed
# says so instead of sitting there forever. Two of them already had.
allow_attributes = "warn"
# Debugging left behind.
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Style the tree already keeps to.
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
mem_forget = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
str_to_string = "warn"
unnecessary_wraps = "warn"

[lints]
workspace = true

[dependencies]
# ── The engine ────────────────────────────────────────────────────────────
# Servo publishes to crates.io (roughly monthly). Using the registry release
# rather than a git dependency keeps clones small and the lockfile stable;
# updating Zervo to a newer engine is a one-line version bump here.
# See docs/SERVO.md.
servo = { version = "0.5.0", default-features = false, features = [
    "background_hang_monitor",
    "baked-in-resources",
    "bundled_freetype",
    "clipboard",
    "js_jit",
    "webgpu",
] }

# The version is here as well as the path so this is not a wildcard
# dependency, which `cargo deny check bans` rejects and rightly so.
zervo-core = { path = "zervo-core", version = "0.4.0" }

# ── Chrome ────────────────────────────────────────────────────────────────
egui = "0.34.3"
# `accesskit` is *not* one of egui-winit's default features, so asking for it
# by name is what puts the platform adapter in the build — without it egui
# builds an accessibility tree every frame and has nowhere to hand it, and the
# chrome is invisible to VoiceOver, Narrator and Orca. `links` is left off on
# purpose: this is a browser, and it opens its own.
egui-winit = { version = "0.34.3", default-features = false, features = [
    "accesskit",
    "clipboard",
] }
egui_glow = { version = "0.34.3", features = ["winit"] }
glow = "0.17.0"
winit = "0.30.13"

# ── Support ───────────────────────────────────────────────────────────────
chrono = "0.4"
# The IANA zone table, for the new tab page's world clocks. Fixed UTC offsets
# would have been one fewer dependency and wrong twice a year.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
dirs = "6.0"
euclid = "0.22"
# Decoding downloaded wallpapers. Already in the tree as one of Servo's own
# dependencies; only the two formats the sources actually serve are enabled.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
keyboard-types = { version = "0.8.3", features = ["serde", "webdriver"] }
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
# Root certificates for the wallpaper fetcher. Zervo already links rustls (it
# installs the process crypto provider for the engine); this is the trust
# anchors it needs to verify a host on its own.
webpki-roots = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows draws through ANGLE (EGL on Direct3D 11) rather than WGL, which is
# what Servo's own Windows builds do.
#
# surfman's WGL backend creates its GL context, restores whatever context was
# current before (none), and hands the caller a context nobody has made
# current; Servo then asks glow to read GL_VERSION and the process dies with
# "Make sure there is a valid GL context currently active". The ANGLE backend
# leaves the new context current, so glow can read it. WGL also wants the
# WGL_NV_DX_interop2 extension, which plenty of Intel drivers do not have.
#
# default-features = false has to be repeated: Cargo takes the union of the
# two declarations, so leaving it off here would switch Servo's defaults back
# on for this target alone.
servo = { version = "0.5.0", default-features = false, features = ["no-wgl"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSAnimationContext",
    "NSApplication",
    "NSColor",
    "NSGraphics",
    "NSImage",
    "NSOpenPanel",
    "NSPanel",
    "NSSavePanel",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3.1", default-features = false, features = [
    "NSArray",
    "NSData",
    "NSGeometry",
    "NSString",
    "NSURL",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer"] }
resvg = "0.48.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# A middle profile: optimised enough to browse with, fast enough to iterate on.
[profile.dev-fast]
inherits = "dev"
opt-level = 2
incremental = true
debug = "line-tables-only"
