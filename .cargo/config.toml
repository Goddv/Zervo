# Local development against a patched Servo checkout.
#
# Uncomment to build with `--features engine-downloads` (see docs/SERVO.md).
# Left commented so a fresh clone builds against the published crate with no
# setup; CI appends the same block for release builds.
#
# [patch.crates-io]
# servo = { git = "https://github.com/Goddv/servo", rev = "0d5a12189e5003ee95b335642470e2baf25fe607" }
#
# Or point at a local checkout while working on the patch itself:
#
# [patch.crates-io]
# servo = { path = "/absolute/path/to/servo/components/servo" }

[env]
# Unoptimised Stylo frames overflow the default 512 KB style-thread stack on
# complex pages; Servo exposes this knob for exactly that reason.
SERVO_STYLE_THREAD_STACK_SIZE_KB = "2048"
