# The engine Zervo builds against.
#
# This used to be commented out, "so a fresh clone builds against the published
# crate with no setup", and CI appended the same block for release builds. That
# stopped being true: the engine bump of 21 August renamed `MouseButton`'s
# variants to `Primary`/`Secondary`/`Auxiliary`, `src/main.rs` follows the new
# names, and the newest `servo` on crates.io is still 0.5.0 with the old ones.
# So a plain `cargo build` failed with three E0599s while every workflow stayed
# green, because the workflows all appended this block and the one job that runs
# on a pull request never builds the binary.
#
# It is committed now, which makes a fresh clone build and puts the revision in
# one place instead of four. Patching `servo` pulls the whole forked workspace
# in with it, since its components depend on each other by path.
#
# The patches live on the fork's `goddv-patches` branch — two of them: embedder
# driven downloads, and the fix that makes a notification without an icon
# actually reach the embedder. See docs/SERVO.md.
#
# When Servo publishes a release carrying the `MouseButton` rename, everything
# except `--features engine-downloads` could go back to the registry.
[patch.crates-io]
servo = { git = "https://github.com/Goddv/servo", rev = "73db5dc4f44c080837464cf40bf8aa888dc7936a" }

# Or point at a local checkout while working on the patch itself:
#
# [patch.crates-io]
# servo = { path = "/absolute/path/to/servo/components/servo" }

[env]
# Unoptimised Stylo frames overflow the default 512 KB style-thread stack on
# complex pages; Servo exposes this knob for exactly that reason.
SERVO_STYLE_THREAD_STACK_SIZE_KB = "2048"

# The oldest macOS a build is allowed to require.
#
# It was not set at all, so each target took rustc's default: 11.0 for
# aarch64-apple-darwin and 10.12 for x86_64-apple-darwin. That was survivable
# while only Apple Silicon was built; `lipo` will fuse two halves advertising
# different floors without comment, so it stops being survivable the moment
# both are shipped in one binary.
#
# 11.0 is the honest number rather than a chosen one: it is what the arm64
# binary already records in its LC_BUILD_VERSION, and it is the floor of the
# arm64 slice of the GStreamer framework Servo pins. The bundle's
# `LSMinimumSystemVersion` used to say 13.0 — typed in beside the compiler
# rather than derived from it — which turned macOS 11 and 12 away at launch
# from a binary that would have run.
#
# Changing this invalidates every crate whose build script compiles C or C++,
# which in this dependency graph is most of the expensive ones. It is a one-off
# cost.
#
# `force = true` because cargo's `[env]` defaults to yielding to whatever is
# already in the environment — which would make this line do nothing on exactly
# the machine where it matters, and produce a universal binary whose two halves
# disagree, silently.
MACOSX_DEPLOYMENT_TARGET = { value = "11.0", force = true }
