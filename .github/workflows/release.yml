name: Release
run-name: ${{ !inputs.tag && (github.event_name == 'workflow_dispatch' || github.ref_type == 'branch') && format('macOS preview · {0} · {1}', github.ref_name, github.sha) || format('Release {0}', inputs.tag || github.ref_name) }}

# Main builds preview artifacts. Tags retain the draft and publish flow.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag. Leave blank to build the selected commit as preview artifacts.
        type: string
        required: false
      publish:
        description: Publish the draft at the end, rather than leaving it for review
        type: boolean
        default: false

# Read-only by default. contents:write is granted to the two small jobs that
# touch the release, and never to the hour-long build jobs, which run with a
# token that cannot write anything and a checkout that does not keep it.
permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' && !inputs.tag }}

jobs:
  draft:
    name: Verify ref and prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # All of history, so the tag exists to verify against.
          fetch-depth: 0
          persist-credentials: false

      - name: Work out the tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$INPUT_TAG" ] && { [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$GITHUB_REF_TYPE" = branch ]; }; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          TAG_COMMIT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}")" \
            || { echo "no such tag: $TAG"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$TAG_COMMIT" ] \
            || { echo "select $TAG as the workflow ref to build that release"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          cargo_version() {
            sed -n '/^\[package\]/,/^\[[a-z]/{s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p;}' | head -1
          }
          TAGGED="$(cargo_version < Cargo.toml)"
          # A fourth release component is stored as Cargo build metadata.
          TAGGED="${TAGGED/+/.}"
          [ "$TAG" = "v$TAGGED" ] \
            || { echo "tag $TAG does not match the Cargo.toml version at that tag ($TAGGED)"; exit 1; }

      - name: Create the draft
        if: steps.meta.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; reusing it"
            exit 0
          fi
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "Zervo ${TAG#v}" \
            --generate-notes

  source:
    name: Source tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Archive
        run: |
          VERSION="$(sed -n '/^\[package\]/,/^\[[a-z]/{s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p;}' Cargo.toml | head -1)"
          VERSION="${VERSION/+/.}"
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="zervo-$VERSION/" \
            -o "dist/zervo-$VERSION-src.tar.gz" \
            HEAD
          sha256sum dist/*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: zervo-source
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    needs: draft
    uses: ./.github/workflows/macos.yml
    # Named rather than `secrets: inherit`, which would hand the build every
    # secret the repository has. All six are optional; absent ones arrive as
    # empty strings and the bundler falls back to an ad-hoc signature.
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

  publish:
    name: Checksums, provenance and publish
    needs: [draft, source, macos]
    if: needs.draft.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # actions/attest needs all three: the first two to sign, the third to
      # record where the artefact lives.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: zervo-*
          path: incoming

      - name: Gather
        run: |
          mkdir -p release
          cp incoming/zervo-macos-arm64/Zervo-*-arm64.dmg release/
          cp incoming/zervo-macos-x86_64/Zervo-*-x86_64.dmg release/
          cp incoming/zervo-source/*-src.tar.gz release/

      - name: Checksums
        # One file covering every platform, which is the thing three
        # independent release-uploading jobs could never produce.
        run: |
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Provenance
        # Needs a public repository, or GitHub Enterprise Cloud. Nice to have
        # rather than load-bearing, so it is not allowed to fail a release.
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*

      - name: Attach to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          # gh works the repository out from --repo, GH_REPO, or the git
          # remotes of the working directory — never from GITHUB_REPOSITORY.
          # This job downloads artefacts and never checks out, so without this
          # every release would fail at the last step with "failed to determine
          # base repo", three hours in.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release upload "$TAG" release/* --clobber

      - name: Publish
        # On a tag push this publishes. On a manual run it waits for the
        # `publish` input, so a release can be built and inspected first.
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest

      - name: Leave it as a draft
        if: ${{ github.event_name != 'push' && !inputs.publish }}
        env:
          TAG: ${{ needs.draft.outputs.tag }}
        run: echo "::notice::$TAG is ready as a draft. Publish it when you have looked at it."
