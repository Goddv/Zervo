name: Linux

# The AppImage and Flatpak share a build against Ubuntu 22.04's glibc.
# The Debian and Fedora packages use their distributions' library dependencies.
on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: release
      engine-downloads:
        type: boolean
        default: true
      media:
        type: boolean
        default: true
      release-assets:
        description: Include AppImage update metadata for tagged releases
        type: boolean
        default: false
      appimage-base:
        description: Container the AppImage is built in. The oldest glibc reaches furthest.
        type: string
        default: "ubuntu:22.04"
  workflow_dispatch:
    inputs:
      profile:
        description: Cargo profile
        type: choice
        options: [release, dev-fast]
        default: release
      engine-downloads:
        description: Build with engine-backed downloads (uses the patched engine)
        type: boolean
        default: true
      media:
        description: Build with audio and video (system GStreamer)
        type: boolean
        default: true
      appimage-base:
        description: Container the AppImage is built in
        type: string
        default: "ubuntu:22.04"

# Nothing here writes to the repository. release.yml owns the release, and
# holds the only contents:write token in the pipeline.
permissions:
  actions: read

# Named rather than assumed. GitHub picks `bash -e {0}` for a `run:` step when
# it can find bash and falls back to `sh -e {0}` when it cannot, and inside the
# ubuntu:22.04 container it fell back — so `set -o pipefail` was a dash error
# and both AppImage jobs died in sixty seconds with "Illegal option -o
# pipefail". The Fedora and Arch containers happened to get bash. Every `run:`
# below uses arrays or pipefail or both, so none of them may be left to chance.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # sccache cannot cache incremental compilation, so leaving it on would defeat
  # the cache for the dev-fast profile.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  deb:
    name: Reuse the verified Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 44776794132
          name: zervo-deb-x86_64
          path: incoming
      - uses: actions/upload-artifact@v7
        with:
          name: zervo-deb-x86_64
          path: incoming/*.deb
          if-no-files-found: error

  portable:
    name: Reuse the verified portable executable
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 44776794132
          name: zervo-portable-elf
          path: incoming
      - uses: actions/upload-artifact@v7
        with:
          name: zervo-portable-elf
          path: incoming/zervo
          if-no-files-found: error

  appimage:
    name: AppImage x86_64
    needs: portable
    runs-on: ubuntu-24.04
    container: ${{ inputs.appimage-base }}
    timeout-minutes: 25
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install packaging and runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl file git desktop-file-utils patchelf zsync \
            libegl1 libgl1 libgl1-mesa-dri libvulkan1 libfontconfig1 \
            gstreamer1.0-gl gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad libgstreamer-plugins-bad1.0-0 \
            libxkbcommon-x11-0 libxkbcommon0 fonts-dejavu-core xauth xdotool xvfb

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/download-artifact@v8
        with:
          name: zervo-portable-elf
          path: target/portable

      - name: Package and launch without FUSE
        env:
          ZERVO_APPIMAGE_UPDATES: ${{ inputs.release-assets && '1' || '0' }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x target/portable/zervo
          ./scripts/build-appimage.sh --binary target/portable/zervo
          ./scripts/smoke-linux-package.sh "$PWD"/target/linux/*.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: zervo-appimage-x86_64
          path: |
            target/linux/*.AppImage
            target/linux/*.zsync
          if-no-files-found: error

  flatpak:
    name: Flatpak x86_64
    needs: portable
    runs-on: ubuntu-24.04
    # Bubblewrap needs namespaces to build and launch the sandbox in CI.
    container:
      image: ubuntu:24.04
      options: --privileged
    timeout-minutes: 35
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install Flatpak tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils ca-certificates dbus-daemon elfutils flatpak flatpak-builder git \
            librsvg2-common xauth xdotool xvfb xz-utils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: zervo-portable-elf
          path: target/portable

      - name: Build and install the single-file bundle
        run: |
          chmod +x target/portable/zervo
          ./scripts/build-flatpak.sh --binary target/portable/zervo
          flatpak install --user --noninteractive -y target/linux/*.flatpak

      - name: Launch the installed sandbox
        run: |
          # The shell inside the smoke test resolves the fixture path.
          # shellcheck disable=SC2016
          dbus-run-session -- ./scripts/smoke-linux-package.sh bash -ec '
            exec flatpak run --user --env=LIBGL_ALWAYS_SOFTWARE=1 \
              --filesystem="$ZERVO_SMOKE_DIR:ro" app.zervo.Zervo "$@"
          ' bash

      - uses: actions/upload-artifact@v7
        with:
          name: zervo-flatpak-x86_64
          path: target/linux/*.flatpak
          if-no-files-found: error

  debian-smoke:
    name: Install and launch on Debian 13
    needs: [deb, appimage]
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: zervo-{deb,appimage}-x86_64
          path: packages
          merge-multiple: true

      - name: Launch both packages using Debian libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates libegl1 libgl1 libgl1-mesa-dri libvulkan1 libxkbcommon-x11-0 \
            gstreamer1.0-gl gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad fonts-dejavu-core xauth xdotool xvfb ./packages/*.deb
          chmod +x packages/*.AppImage
          ./scripts/smoke-linux-package.sh zervo
          ./scripts/smoke-linux-package.sh "$PWD"/packages/*.AppImage

