name: Heion website

on:
  push:
    branches: [main]
    paths: [docs/index.html, 'docs/site/**', scripts/stage-website.py, .github/workflows/pages.yml]
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'release' && 'heion-pages-release' || 'heion-pages' }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Pages from main after publication
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # A release event runs from its tag. The Pages environment deploys main.
      - run: gh workflow run pages.yml --ref main

  build:
    name: Check downloads and stage website
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Stage the latest stable downloads
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/heion-release.json"
          python3 scripts/stage-website.py "$RUNNER_TEMP/heion-release.json" "$GITHUB_REPOSITORY"
          if [ -f _site/index.html ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v5
        if: steps.release.outputs.ready == 'true'
        with:
          path: _site

  deploy:
    name: Publish Heion website
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
