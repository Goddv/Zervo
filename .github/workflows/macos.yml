name: macOS

# Two disk images, one per architecture, each built natively on its own runner.
#
# `lipo` can fuse them into one universal bundle instead — the bundler still
# takes `--universal`, and it is cheap, because mozjs downloads a prebuilt
# SpiderMonkey per target and the GStreamer framework Servo pins is already
# fat. Two are shipped rather than one because a download that says which Mac
# it is for is worth more than one that runs on both, and because each of these
# is half the size: a single-architecture bundle has its GStreamer libraries
# thinned to match, which is about 80 MB that could never have run.
#
# Both labels are generally available and free on a public repository.
on:
  workflow_call:
    inputs:
      updater-public-key:
        type: string
        default: ""
      profile:
        type: string
        default: release
      engine-downloads:
        type: boolean
        default: true
      media:
        type: boolean
        default: true
      checks:
        type: boolean
        default: true
    secrets:
      MACOS_CERTIFICATE:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_SIGN_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      profile:
        description: Cargo profile
        type: choice
        options: [release, dev-fast]
        default: release
      engine-downloads:
        description: Build with engine-backed downloads (uses the patched engine)
        type: boolean
        default: true
      media:
        description: Build with audio and video (bundles GStreamer)
        type: boolean
        default: true
      checks:
        description: Also run clippy and the tests against the engine build
        type: boolean
        default: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Keep the universal SDK in sync with the version of the MSE patch.
  GSTREAMER_VERSION: 1.28.9

jobs:
  servo:
    name: Resolve Servo and Cargo dependencies
    runs-on: ubuntu-24.04
    outputs:
      upstream: ${{ steps.revisions.outputs.upstream }}
      fork: ${{ steps.revisions.outputs.fork }}
      tree: ${{ steps.lockfile.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          key: servo-release
          sccache: "false"
      - name: Resolve both Servo main branches
        id: revisions
        run: scripts/prepare-servo.sh --resolve >> "$GITHUB_OUTPUT"
      - name: Prepare Servo and generate the shared Cargo lockfile
        id: lockfile
        env:
          HEION_SERVO_UPSTREAM: ${{ steps.revisions.outputs.upstream }}
          HEION_SERVO_FORK: ${{ steps.revisions.outputs.fork }}
        run: |
          # shellcheck source=scripts/lib/common.sh
          source scripts/lib/common.sh
          scripts/prepare-servo.sh ../servo
          zervo_resolve_servo ../servo aarch64-apple-darwin
          tree="$(git -C ../servo write-tree)"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/servo-build"
          {
            printf 'Upstream: https://github.com/servo/servo/commit/%s\n' "$HEION_SERVO_UPSTREAM"
            printf 'Fork: https://github.com/Goddv/servo/commit/%s\n' "$HEION_SERVO_FORK"
            printf 'Patched tree: %s\n' "$tree"
          } > "$RUNNER_TEMP/servo-build/servo-revisions.txt"
          cp Cargo.lock "$RUNNER_TEMP/servo-build/Cargo.lock"
      - uses: actions/upload-artifact@v7
        with:
          name: zervo-servo-build
          path: ${{ runner.temp }}/servo-build/
          if-no-files-found: error
          overwrite: true

  build:
    name: ${{ matrix.arch }} .app
    needs: servo
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26,       arch: arm64 }
          - { runner: macos-26-intel, arch: x86_64 }

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show environment
        # cmake and pkg-config — Servo's only macOS system dependencies — are
        # already on the runner image, so there is no brew step.
        run: |
          sw_vers
          xcodebuild -version
          xcrun --find actool
          cmake --version | head -1
          pkg-config --version
          df -h / | tail -1

      - uses: ./.github/actions/setup-build
        with:
          key: macos

      - name: Prepare the resolved Servo source
        env:
          HEION_SERVO_UPSTREAM: ${{ needs.servo.outputs.upstream }}
          HEION_SERVO_FORK: ${{ needs.servo.outputs.fork }}
          SERVO_TREE: ${{ needs.servo.outputs.tree }}
        run: |
          scripts/prepare-servo.sh ../servo
          test "$(git -C ../servo write-tree)" = "$SERVO_TREE"

      - uses: actions/download-artifact@v8
        with:
          name: zervo-servo-build
          path: ${{ runner.temp }}/servo-build

      - name: Use the shared lockfile
        run: cp "$RUNNER_TEMP/servo-build/Cargo.lock" Cargo.lock

      - name: Build patched Sparkle
        if: inputs.updater-public-key != ''
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/build-sparkle.sh "$RUNNER_TEMP/zervo-sparkle" "$ARCH"

      - name: Install GStreamer
        if: inputs.media
        run: |
          BASE="https://gstreamer.freedesktop.org/data/pkg/osx/$GSTREAMER_VERSION"
          for PKG in gstreamer-1.0 gstreamer-1.0-devel; do
            curl -fLsS --retry 5 --retry-delay 2 --retry-all-errors \
                 -o "/tmp/$PKG.pkg" "$BASE/$PKG-$GSTREAMER_VERSION-universal.pkg"
            sudo installer -pkg "/tmp/$PKG.pkg" -target /
          done
          # Both slices, or the Intel half of the build has nothing to link.
          lipo -archs /Library/Frameworks/GStreamer.framework/Versions/1.0/lib/libgstreamer-1.0.dylib

      - name: Is there a signing certificate?
        # The `secrets` context is not available in a step-level `if:`, so its
        # presence is turned into an ordinary environment variable first. Only
        # the answer crosses over, never the secret.
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "HAS_SIGNING_CERT=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING_CERT=false" >> "$GITHUB_ENV"
            echo "::notice::No signing certificate; the bundle will carry an ad-hoc signature only."
          fi

      - name: Import the signing certificate
        # Inert until the secrets exist. Without them the bundler falls back to
        # an ad-hoc signature, which is what every release so far has shipped.
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build and bundle
        env:
          FEATURES_ENGINE_DOWNLOADS: ${{ inputs.engine-downloads }}
          FEATURES_MEDIA: ${{ inputs.media }}
          HEION_SERVO_CHECKOUT: ../servo
          HEION_SERVO_UPSTREAM: ${{ needs.servo.outputs.upstream }}
          HEION_SERVO_FORK: ${{ needs.servo.outputs.fork }}
          ZERVO_LOCKED: "1"
          # Through the environment, not interpolated into the script body:
          # `profile` is a free-form string on the workflow_call side.
          PROFILE: ${{ inputs.profile }}
          ZERVO_SPARKLE_PUBLIC_KEY: ${{ inputs.updater-public-key }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -o pipefail
          FEATURES=""
          if [ "$FEATURES_ENGINE_DOWNLOADS" = "true" ]; then FEATURES="engine-downloads"; fi
          if [ "$FEATURES_MEDIA" = "true" ]; then FEATURES="${FEATURES:+$FEATURES,}media-source"; fi

          ARGS=(--profile "$PROFILE" --dmg)
          if [ -n "$ZERVO_SPARKLE_PUBLIC_KEY" ]; then
            ARGS+=(--updates "$RUNNER_TEMP/zervo-sparkle")
          fi
          if [ -n "$FEATURES" ]; then ARGS+=(--features "$FEATURES"); fi
          if [ -n "$SIGN_IDENTITY" ]; then
            ARGS+=(--sign "$SIGN_IDENTITY")
            if [ -n "$APPLE_ID" ]; then ARGS+=(--notarize); fi
          fi

          ./scripts/bundle-macos.sh "${ARGS[@]}" 2>&1 | tee build.log
          if grep -q "Failed to link pre-built archive" build.log; then
            echo "::warning::mozjs could not fetch its prebuilt SpiderMonkey and built it from source"
          fi

      - name: Check the bundle
        # The three things that are easy to get silently wrong and impossible
        # to notice from a green build: whether both architectures actually
        # made it in, whether the two halves agree on how old a macOS they will
        # run on, and whether the signature the loader insists on is present.
        env:
          WANT_ARCH: ${{ matrix.arch }}
          FEATURES_MEDIA: ${{ inputs.media }}
        run: |
          APP=target/Heion.app
          BIN="$APP/Contents/MacOS/Heion"
          echo "--- architecture ---"
          ARCHS="$(lipo -archs "$BIN")"
          echo "$ARCHS"
          # Exactly one, and the one this runner was for. A cross-build that
          # silently produced the host's architecture would otherwise ship as
          # the other one's download.
          [ "$ARCHS" = "$WANT_ARCH" ] || { echo "expected $WANT_ARCH, got '$ARCHS'"; exit 1; }

          echo "--- deployment target ---"
          # .cargo/config.toml forces this; the check is what notices when
          # something has got past it.
          otool -l "$BIN" | grep -E 'minos|sdk ' || true
          MINOS="$(otool -l "$BIN" | awk '/minos/ { print $2 }' | sort -u | tr '\n' ' ')"
          case "$(echo "$MINOS" | wc -w | tr -d ' ')" in
            1) echo "targets macOS $MINOS" ;;
            0) echo "::warning::no LC_BUILD_VERSION found; cannot check the deployment target" ;;
            *) echo "more than one minimum macOS in one slice: $MINOS"; exit 1 ;;
          esac

          PLIST_MIN="$(plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist")"
          echo "Info.plist says $PLIST_MIN"
          if [ -n "$MINOS" ] && [ "$PLIST_MIN" != "$(echo "$MINOS" | tr -d ' ')" ]; then
            echo "::warning::Info.plist claims macOS $PLIST_MIN but the binary was built for $MINOS"
          fi

          echo "--- app icon ---"
          test -s "$APP/Contents/Resources/Assets.car"
          test "$(plutil -extract CFBundleIconName raw "$APP/Contents/Info.plist")" = Heion

          echo "--- widget composer ---"
          BRIDGE="$APP/Contents/Frameworks/HeionWidgetPlayground.dylib"
          if [ "$WANT_ARCH" = arm64 ]; then
            test "$(lipo -archs "$BRIDGE")" = arm64
            test -n "$(plutil -extract NSSpeechRecognitionUsageDescription raw "$APP/Contents/Info.plist")"
            codesign --verify --strict "$BRIDGE"
          else
            test ! -e "$BRIDGE"
          fi

          echo "--- signature ---"
          if [ "$FEATURES_MEDIA" = true ]; then
            test "$(lipo -archs "$APP/Contents/MacOS/lib/libgstmse-1.0.0.dylib")" = "$WANT_ARCH"
            test -f "$APP/Contents/MacOS/lib/libgstmse.dylib"
          fi
          codesign -dv --verbose=4 "$APP" 2>&1 | head -20
          codesign --verify --strict --verbose=2 "$APP"

          echo "--- Info.plist ---"
          plutil -p "$APP/Contents/Info.plist" | head -30

      # Banked before anything optional runs. `timeout-minutes` on the job is a
      # cancellation rather than a failure, so a lint that overruns takes the
      # whole job down with it — including an upload step sitting after it, and
      # with it a disk image that took hours to produce.
      - uses: actions/upload-artifact@v7
        with:
          name: zervo-macos-${{ matrix.arch }}
          path: target/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Lint and test the engine build
        # The half of the tree that needs the engine, checked where the engine
        # is already compiled. `zervo-core` is linted and tested on every pull
        # request (see check.yml); this covers everything that is not in it,
        # including the `engine-downloads` paths, which cannot be type-checked
        # at all against the published Servo crate.
        #
        # Clippy re-checks the dependency graph rather than reusing the build's
        # artefacts — sccache keys on the rustc invocation, and `--emit=metadata`
        # is not `--emit=link` — so this is not free. On a job already budgeted
        # in hours, for something that runs on release tags, it is worth knowing
        # before the release rather than after it.
        if: inputs.checks
        continue-on-error: true
        timeout-minutes: 90
        env:
          FEATURES_ENGINE_DOWNLOADS: ${{ inputs.engine-downloads }}
          FEATURES_MEDIA: ${{ inputs.media }}
        run: |
          FEATURES=""
          if [ "$FEATURES_ENGINE_DOWNLOADS" = "true" ]; then FEATURES="engine-downloads"; fi
          if [ "$FEATURES_MEDIA" = "true" ]; then
            FEATURES="${FEATURES:+$FEATURES,}media-source"
            GSTREAMER_ROOT=/Library/Frameworks/GStreamer.framework/Versions/1.0
            export PATH="$GSTREAMER_ROOT/bin:$PATH"
            export PKG_CONFIG_PATH="$GSTREAMER_ROOT/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            export DYLD_LIBRARY_PATH="$GSTREAMER_ROOT/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          fi
          ARGS=(--locked)
          if [ -n "$FEATURES" ]; then ARGS+=(--features "$FEATURES"); fi
          cargo clippy --all-targets "${ARGS[@]}" -- -D warnings
          cargo test "${ARGS[@]}"

      - name: sccache stats
        run: ${SCCACHE_PATH:-sccache} --show-stats

      - name: Report sizes
        run: du -sh target/Heion.app target/*.dmg

