name: macOS

# One job, one universal .app.
#
# It used to be one arm64 build on one runner, and "Apple Silicon only" in the
# release notes. Building the Intel half turns out to be nearly free: mozjs
# downloads a prebuilt SpiderMonkey for x86_64-apple-darwin rather than
# compiling it, so the second `cargo build --target` is minutes rather than
# hours, and every dylib in the GStreamer framework Servo pins is already
# universal. That leaves exactly one file to `lipo`.
#
# So there is no Intel runner here, and no second disk image. `macos-15-intel`
# exists and is free, but a second full job to produce a second download that
# half the users would pick wrongly is worse than one file that runs anywhere.
on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: release
      runner:
        type: string
        default: macos-15
      engine-downloads:
        type: boolean
        default: true
      media:
        type: boolean
        default: true
      checks:
        type: boolean
        default: true
    secrets:
      MACOS_CERTIFICATE:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_SIGN_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      profile:
        description: Cargo profile
        type: choice
        options: [release, dev-fast]
        default: release
      runner:
        description: Runner label. Both are Apple Silicon and both are GA.
        type: choice
        options: [macos-15, macos-26]
        default: macos-15
      engine-downloads:
        description: Build with engine-backed downloads (uses the patched engine)
        type: boolean
        default: true
      media:
        description: Build with audio and video (bundles GStreamer)
        type: boolean
        default: true
      checks:
        description: Also run clippy and the tests against the engine build
        type: boolean
        default: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Servo only supports the official GStreamer distribution on macOS, and pins
  # this version. Both packages are needed: the runtime and the headers.
  GSTREAMER_VERSION: 1.22.3

jobs:
  build:
    name: Universal .app
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Stop XProtect
        # XProtect scans the packaged .dmg and can fail the job; Servo's own
        # macOS CI does exactly this.
        run: sudo pkill -9 XProtect || true

      - name: Show environment
        # cmake and pkg-config — Servo's only macOS system dependencies — are
        # already on the runner image, so there is no brew step.
        run: |
          sw_vers
          cmake --version | head -1
          pkg-config --version
          df -h / | tail -1

      - uses: ./.github/actions/setup-build
        with:
          key: macos

      - name: Add the Intel target
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install GStreamer
        if: inputs.media
        run: |
          BASE=https://github.com/servo/servo-build-deps/releases/download/macOS
          for PKG in gstreamer-1.0 gstreamer-1.0-devel; do
            curl -L -sS --retry 5 --retry-delay 2 --retry-all-errors \
                 -o "/tmp/$PKG.pkg" "$BASE/$PKG-$GSTREAMER_VERSION-universal.pkg"
            sudo installer -pkg "/tmp/$PKG.pkg" -target /
          done
          # Both slices, or the Intel half of the build has nothing to link.
          lipo -archs /Library/Frameworks/GStreamer.framework/Versions/1.0/lib/libgstreamer-1.0.dylib

      - name: Is there a signing certificate?
        # The `secrets` context is not available in a step-level `if:`, so its
        # presence is turned into an ordinary environment variable first. Only
        # the answer crosses over, never the secret.
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "HAS_SIGNING_CERT=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING_CERT=false" >> "$GITHUB_ENV"
            echo "::notice::No signing certificate; the bundle will carry an ad-hoc signature only."
          fi

      - name: Import the signing certificate
        # Inert until the secrets exist. Without them the bundler falls back to
        # an ad-hoc signature, which is what every release so far has shipped.
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build and bundle
        env:
          FEATURES_ENGINE_DOWNLOADS: ${{ inputs.engine-downloads }}
          FEATURES_MEDIA: ${{ inputs.media }}
          # Through the environment, not interpolated into the script body:
          # `profile` is a free-form string on the workflow_call side.
          PROFILE: ${{ inputs.profile }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -o pipefail
          FEATURES=""
          if [ "$FEATURES_ENGINE_DOWNLOADS" = "true" ]; then FEATURES="engine-downloads"; fi
          if [ "$FEATURES_MEDIA" = "true" ]; then FEATURES="${FEATURES:+$FEATURES,}media"; fi

          ARGS=(--profile "$PROFILE" --universal --dmg)
          if [ -n "$FEATURES" ]; then ARGS+=(--features "$FEATURES"); fi
          if [ -n "$SIGN_IDENTITY" ]; then
            ARGS+=(--sign "$SIGN_IDENTITY")
            if [ -n "$APPLE_ID" ]; then ARGS+=(--notarize); fi
          fi

          ./scripts/bundle-macos.sh "${ARGS[@]}" 2>&1 | tee build.log
          if grep -q "Failed to link pre-built archive" build.log; then
            echo "::warning::mozjs could not fetch its prebuilt SpiderMonkey and built it from source"
          fi

      - name: Check the bundle
        # The three things that are easy to get silently wrong and impossible
        # to notice from a green build: whether both architectures actually
        # made it in, whether the two halves agree on how old a macOS they will
        # run on, and whether the signature the loader insists on is present.
        run: |
          BIN=target/Zervo.app/Contents/MacOS/Zervo
          echo "--- architectures ---"
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -q x86_64 || { echo "no Intel slice"; exit 1; }
          lipo -archs "$BIN" | grep -q arm64  || { echo "no Apple Silicon slice"; exit 1; }

          echo "--- deployment target, per slice ---"
          # Both halves must claim the same floor. lipo fuses two binaries that
          # disagree without a word, and the result advertises two different
          # minimums for one file. .cargo/config.toml forces the value; this is
          # what notices when something has got past it.
          otool -l "$BIN" | grep -E 'minos|sdk ' || true
          MINOS="$(otool -l "$BIN" | awk '/minos/ { print $2 }' | sort -u | tr '\n' ' ')"
          case "$(echo "$MINOS" | wc -w | tr -d ' ')" in
            1) echo "both slices target macOS $MINOS" ;;
            0) echo "::warning::no LC_BUILD_VERSION found; cannot check the deployment target" ;;
            *) echo "the architectures disagree about the minimum macOS: $MINOS"; exit 1 ;;
          esac

          PLIST_MIN="$(plutil -extract LSMinimumSystemVersion raw target/Zervo.app/Contents/Info.plist)"
          echo "Info.plist says $PLIST_MIN"
          if [ -n "$MINOS" ] && [ "$PLIST_MIN" != "$(echo "$MINOS" | tr -d ' ')" ]; then
            echo "::warning::Info.plist claims macOS $PLIST_MIN but the binary was built for $MINOS"
          fi

          echo "--- signature ---"
          codesign -dv --verbose=4 target/Zervo.app 2>&1 | head -20
          codesign --verify --strict --verbose=2 target/Zervo.app

          echo "--- Info.plist ---"
          plutil -p target/Zervo.app/Contents/Info.plist | head -30

      # Banked before anything optional runs. `timeout-minutes` on the job is a
      # cancellation rather than a failure, so a lint that overruns takes the
      # whole job down with it — including an upload step sitting after it, and
      # with it a disk image that took hours to produce.
      - uses: actions/upload-artifact@v7
        with:
          name: zervo-macos-universal
          path: target/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Lint and test the engine build
        # The half of the tree that needs the engine, checked where the engine
        # is already compiled. `zervo-core` is linted and tested on every pull
        # request (see check.yml); this covers everything that is not in it,
        # including the `engine-downloads` paths, which cannot be type-checked
        # at all against the published Servo crate.
        #
        # Clippy re-checks the dependency graph rather than reusing the build's
        # artefacts — sccache keys on the rustc invocation, and `--emit=metadata`
        # is not `--emit=link` — so this is not free. On a job already budgeted
        # in hours, for something that runs on release tags, it is worth knowing
        # before the release rather than after it.
        if: inputs.checks
        continue-on-error: true
        timeout-minutes: 90
        env:
          FEATURES_ENGINE_DOWNLOADS: ${{ inputs.engine-downloads }}
          FEATURES_MEDIA: ${{ inputs.media }}
        run: |
          FEATURES=""
          if [ "$FEATURES_ENGINE_DOWNLOADS" = "true" ]; then FEATURES="engine-downloads"; fi
          if [ "$FEATURES_MEDIA" = "true" ]; then FEATURES="${FEATURES:+$FEATURES,}media"; fi
          ARGS=(--locked)
          if [ -n "$FEATURES" ]; then ARGS+=(--features "$FEATURES"); fi
          cargo clippy --all-targets "${ARGS[@]}" -- -D warnings
          cargo test "${ARGS[@]}"

      - name: sccache stats
        run: ${SCCACHE_PATH:-sccache} --show-stats

      - name: Report sizes
        run: du -sh target/Zervo.app target/*.dmg

