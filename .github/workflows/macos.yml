name: macOS

# Zervo compiles the Servo engine, so a cold build is roughly an hour of macOS
# runner time. macOS minutes bill at 10x on private repos, so the build runs on
# release tags and manual dispatch only. (On a public repo GitHub-hosted
# runners are free and unlimited — if this repo is public, feel free to add
# `pull_request` here; with sccache warm the job is ~15-25 minutes.)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      profile:
        description: Cargo profile
        type: choice
        options: [release, dev-fast]
        default: release
      engine-downloads:
        description: Build with engine-backed downloads (uses the patched engine)
        type: boolean
        default: true
      media:
        description: Build with audio and video (installs GStreamer)
        type: boolean
        default: true

permissions:
  contents: write   # to attach the .dmg to a release

env:
  CARGO_TERM_COLOR: always
  # Servo has no download support of its own (servo/servo#40210), so released
  # builds compile against a fork carrying the embedder-download patch. Pinned
  # to a revision, never a branch: Servo lands dozens of commits a day and the
  # embedding API is not stable.
  # Servo only supports the official GStreamer distribution on macOS, and pins
  # this version. Both packages are needed: the runtime and the headers.
  GSTREAMER_VERSION: 1.22.3
  SERVO_FORK: https://github.com/Goddv/servo
  SERVO_REV: 36176b7d2c065dbed8f37edf39da495d41a4eaca
  # sccache is the single biggest lever here: Servo's own CI measures ~15 min
  # warm against ~54 min cold for the same profile.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  build:
    name: Build .app
    # macos-15 is Apple Silicon, which is what Zervo targets. Do not pin
    # macos-14: it is deprecated and scheduled for removal.
    # If a fat-LTO link runs out of memory (arm64 runners have 7 GB), switch to
    # macos-15-intel, which has 14 GB.
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - name: Stop XProtect
        # XProtect scans the packaged .dmg and can fail the job; Servo's own
        # macOS CI does exactly this.
        run: sudo pkill -9 XProtect || true

      - name: Show environment
        # cmake and pkg-config — Servo's only macOS system dependencies — are
        # already on the runner image, so there is no brew step.
        run: |
          sw_vers && cmake --version | head -1 && pkg-config --version
          df -h / | tail -1

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Rust toolchain
        # Pinned by rust-toolchain.toml, matching Servo's own channel.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry
        # Only the inputs are cached. The build output is far larger than the
        # 10 GB per-repo cache limit (a Servo target dir runs to tens of GB),
        # so caching target/ would silently never restore.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install GStreamer
        run: |
          if [ "${{ inputs.media }}" = "false" ]; then
            echo "media off; skipping GStreamer"
            exit 0
          fi
          BASE=https://github.com/servo/servo-build-deps/releases/download/macOS
          for PKG in gstreamer-1.0 gstreamer-1.0-devel; do
            curl -L -sS -o "/tmp/$PKG.pkg" "$BASE/$PKG-$GSTREAMER_VERSION-universal.pkg"
            sudo installer -pkg "/tmp/$PKG.pkg" -target /
          done
          ls /Library/Frameworks/GStreamer.framework/Versions/1.0/bin/pkg-config

      - name: Point Cargo at the patched engine
        # Appended rather than committed, so a plain clone still builds against
        # the published crate with no setup. Patching `servo` pulls the whole
        # forked workspace in with it, since its components depend on each
        # other by path.
        run: |
          if [ "${{ inputs.engine-downloads }}" = "false" ]; then
            echo "engine-downloads off; building against the published crate"
            exit 0
          fi
          cat >> .cargo/config.toml <<EOF

          [patch.crates-io]
          servo = { git = "$SERVO_FORK", rev = "$SERVO_REV" }
          EOF
          tail -5 .cargo/config.toml

      - name: Build and bundle
        run: |
          ARGS=(--profile "${{ inputs.profile || 'release' }}" --dmg)
          FEATURES=""
          if [ "${{ inputs.engine-downloads }}" != "false" ]; then
            FEATURES="engine-downloads"
          fi
          if [ "${{ inputs.media }}" != "false" ]; then
            FEATURES="${FEATURES:+$FEATURES,}media"
          fi
          [ -n "$FEATURES" ] && ARGS+=(--features "$FEATURES")
          ./scripts/bundle-macos.sh "${ARGS[@]}"

      - name: Lint and test the binary
        # The half of the tree that needs the engine, checked where the engine
        # is already compiled. `zervo-core` is linted and tested on every pull
        # request (see check.yml); this covers everything that is not in it,
        # including the `engine-downloads` paths, which cannot be type-checked
        # at all against the published Servo crate.
        #
        # Clippy re-checks the dependency graph rather than reusing the build's
        # artifacts — sccache keys on the rustc invocation, and `--emit=metadata`
        # is not `--emit=link` — so this is not free. On a job already budgeted
        # at three hours, for something that runs on release tags, it is worth
        # knowing before the release rather than after it.
        continue-on-error: true
        run: |
          FEATURES=""
          if [ "${{ inputs.engine-downloads }}" != "false" ]; then
            FEATURES="engine-downloads"
          fi
          if [ "${{ inputs.media }}" != "false" ]; then
            FEATURES="${FEATURES:+$FEATURES,}media"
          fi
          ARGS=()
          [ -n "$FEATURES" ] && ARGS+=(--features "$FEATURES")
          cargo clippy --all-targets "${ARGS[@]}" -- -D warnings
          cargo test "${ARGS[@]}"

      - name: sccache stats
        run: sccache --show-stats

      - name: Report sizes
        run: du -sh target/Zervo.app target/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Zervo-macos-arm64
          path: target/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.dmg
          body: |
            Unsigned build, with downloads and media playback. macOS will refuse to open it until you clear the
            quarantine flag:

            ```
            xattr -dr com.apple.quarantine /Applications/Zervo.app
            ```

            See docs/PACKAGING.md for why.
